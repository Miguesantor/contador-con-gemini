<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contador de Basura</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 40px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 10px 0;
    }

    .container {
      width: 90%;
      max-width: 430px; 
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
    }

    .toast {
      position: fixed;
      top: 60px;
      background-color: var(--accent);
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
    }

    .identity-banner {
      background: #334155;
      padding: 12px 16px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .identity-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-left: 8px;
      cursor: pointer;
    }

    .reset-btn {
      margin-top: 30px;
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">¡Punto registrado! 🗑️</div>

  <header>
    <h1>🗑️ Control de Basura</h1>
    <p style="color: #94a3b8; font-size: 0.9rem;">Sincronizado en tiempo real</p>
  </header>

  <div class="container">
    <div id="identityBanner" class="identity-banner">
      Cargando identidad...
    </div>

    <div id="app" style="display: flex; flex-direction: column; gap: 15px;">
      <p style="text-align: center; color: #94a3b8;">Cargando marcador...</p>
    </div>
  </div>

  <button class="reset-btn" id="btnReset">Reiniciar Contadores</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAd6Gv58nPD6evAAP1kfQwKb4iwjrs8puw",
      authDomain: "contador-basura-f8369.firebaseapp.com",
      databaseURL: "https://contador-basura-f8369-default-rtdb.firebaseio.com",
      projectId: "contador-basura-f8369",
      storageBucket: "contador-basura-f8369.firebasestorage.app",
      messagingSenderId: "389384020552",
      appId: "1:389384020552:web:cd5131fb3a17fc94f96e7d",
      measurementId: "G-FN1SHCSDHP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'puntos');

    const integrantesIniciales = { "Miguel": 0, "Jonatan": 0 };

    function obtenerUsuarioLocal() {
      return localStorage.getItem('usuario_basura');
    }

    function guardarUsuarioLocal(nombre) {
      localStorage.setItem('usuario_basura', nombre);
      actualizarBannerIdentidad();
      procesarSumaNFC();
    }

    function actualizarBannerIdentidad() {
      const usuario = obtenerUsuarioLocal();
      const banner = document.getElementById('identityBanner');

      if (usuario) {
        banner.innerHTML = `Este iPhone pertenece a: <b>${usuario}</b> 
          <button class="identity-btn" onclick="cambiarUsuario()">Cambiar</button>`;
      } else {
        banner.innerHTML = `¿Quién eres en este iPhone?<br><br>
          <button class="identity-btn" onclick="seleccionarUsuario('Miguel')">Miguel</button>
          <button class="identity-btn" onclick="seleccionarUsuario('Jonatan')">Jonatan</button>`;
      }
    }

    window.seleccionarUsuario = function(nombre) {
      guardarUsuarioLocal(nombre);
    };

    window.cambiarUsuario = function() {
      localStorage.removeItem('usuario_basura');
      actualizarBannerIdentidad();
    };

    onValue(dbRef, (snapshot) => {
      let puntos = snapshot.val();
      if (!puntos) {
        set(dbRef, integrantesIniciales);
        puntos = integrantesIniciales;
      }
      render(puntos);
    });

    function render(puntos) {
      const container = document.getElementById('app');
      container.innerHTML = '';

      for (const [usuario, score] of Object.entries(puntos)) {
        container.innerHTML += `
          <div class="card">
            <div class="user-info">
              <span class="user-name">${usuario}</span>
              <span style="color: #94a3b8; font-size: 0.8rem;">Veces que sacó la basura</span>
            </div>
            <div class="score">${score}</div>
          </div>
        `;
      }
    }

    function mostrarToast(mensaje) {
      const toast = document.getElementById('toast');
      toast.innerText = mensaje;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function procesarSumaNFC() {
      const urlParams = new URLSearchParams(window.location.search);
      const debeSumar = urlParams.get('sumar');
      const usuarioLocal = obtenerUsuarioLocal();

      if (debeSumar && usuarioLocal) {
        const snapshot = await get(dbRef);
        let puntos = snapshot.val() || integrantesIniciales;

        if (puntos[usuarioLocal] !== undefined) {
          const nuevoPuntaje = puntos[usuarioLocal] + 1;
          await set(ref(db, `puntos/${usuarioLocal}`), nuevoPuntaje);
          mostrarToast(`¡+1 punto para ${usuarioLocal}! 🗑️`);
        }

        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    document.getElementById('btnReset').addEventListener('click', () => {
      if (confirm("¿Quieres reiniciar los contadores a 0?")) {
        set(dbRef, integrantesIniciales);
      }
    });

    actualizarBannerIdentidad();
    procesarSumaNFC();
  </script>
</body>
</html>
